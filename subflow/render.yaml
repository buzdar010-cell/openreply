services:
  - type: web
    name: subflow
    runtime: node
    rootDir: subflow
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run setup && npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SCOPES
        value: read_products,write_products
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        value: ""
